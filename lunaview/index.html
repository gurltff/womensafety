<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LunaView</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2214%22 fill=%22%23c9c4b8%22/%3E%3Ccircle cx=%2211%22 cy=%2212%22 r=%223%22 fill=%22%23a39d90%22/%3E%3Ccircle cx=%2220%22 cy=%2220%22 r=%224%22 fill=%22%23a39d90%22/%3E%3C/svg%3E">
  <meta name="description" content="Simulate a lunar rover mission before launch: real terrain, sunlight, temperature, battery and Earth contact.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
</head>
<body>
  <main id="app">
    <canvas id="globe" aria-label="3D Moon. Drag to rotate, scroll to zoom, double-click to fly in. In route mode, click to add route points."></canvas>
    <div id="labels" class="labels"></div>

    <header class="top">
      <button class="round" id="menuBtn" type="button" aria-label="Mission setup" aria-controls="setup" aria-expanded="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>
        <input id="search" type="search" placeholder="Go to a site or coordinates (-89.4, -137)" autocomplete="off" aria-label="Go to a landing site">
        <ul id="results" class="results" role="listbox" hidden></ul>
      </div>
      <button class="cta" id="runBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8Z"/></svg>
        <span>Simulate mission</span>
      </button>
    </header>

    <div class="brand" aria-hidden="true">LUNAVIEW<span>Rover mission simulator</span></div>

    <div class="bottom">
      <button class="chip site-chip" id="siteChip" type="button" title="Open mission setup">
        <span class="chip-k" id="roverChipK">ROVER</span>
        <span id="siteName">MID-SIZE ROVER</span>
        <span class="chip-sub" id="siteCoords">No route yet</span>
      </button>

      <div class="center-stack">
        <div class="playback" id="playback" hidden>
          <button class="round small" type="button" id="pbPlay" aria-label="Play the mission">▶</button>
          <input type="range" id="pbSlider" min="0" max="100" value="0" aria-label="Mission time">
          <span class="mono" id="pbText"></span>
        </div>
        <div class="readout" id="readout" aria-live="polite">
          <span class="sun-dot"></span><span id="roSun">Sun —</span>
          <span class="earth-dot"></span><span id="roEarth">Earth —</span>
        </div>
        <nav class="toolbar" aria-label="View controls">
          <button type="button" class="tool" data-tool="draw" aria-pressed="false" title="Draw the rover's route: click points on the ground">
            <svg viewBox="0 0 32 32"><circle cx="7" cy="24" r="3"/><circle cx="25" cy="8" r="3"/><path d="M9.5 22c4-6 9-4 13.5-11.5" stroke-dasharray="3 3"/></svg>
            <span>Route</span></button>
          <button type="button" class="tool" data-tool="map" aria-pressed="false" title="Sunlight map: how much of the mission each spot is sunlit">
            <svg viewBox="0 0 32 32"><rect x="5" y="5" width="22" height="22" rx="2"/><path d="M5 16h22M16 5v22"/><circle cx="10.5" cy="10.5" r="2.5"/></svg>
            <span>Sun map</span></button>
          <button type="button" class="tool on" data-tool="sun" aria-pressed="true" title="Real sunlight for the chosen time">
            <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="5"/><path d="M16 4v4M16 24v4M4 16h4M24 16h4M7.5 7.5l2.8 2.8M21.7 21.7l2.8 2.8M7.5 24.5l2.8-2.8M21.7 10.3l2.8-2.8"/></svg>
            <span>Sunlight</span></button>
          <button type="button" class="tool" data-tool="relief" aria-pressed="false" title="Terrain height: true scale or 5x exaggerated">
            <svg viewBox="0 0 32 32"><path d="M3 25 11 12l5 7 4-5 9 11Z"/></svg>
            <span id="reliefLabel">Relief ×1</span></button>
          <button type="button" class="tool" data-tool="fly" title="Fly to the route">
            <svg viewBox="0 0 32 32"><circle cx="14" cy="14" r="8"/><path d="m20 20 7 7M14 10v8M10 14h8"/></svg>
            <span>Close-up</span></button>
          <button type="button" class="tool" data-tool="home" title="Back to the whole Moon">
            <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/><path d="M8 12c4 2 12 2 16 0M8 20c4-2 12-2 16 0"/></svg>
            <span>Globe</span></button>
          <button type="button" class="tool" data-tool="stand" title="Stand where the rover is">
            <svg viewBox="0 0 32 32"><path d="M3 24c4-5 7-7 10-5s5-6 9-4 5 4 7 4"/><circle cx="22" cy="8" r="3"/><path d="M3 27h26"/></svg>
            <span>Stand</span></button>
          <button type="button" class="tool" data-tool="compare" title="Compare simulated missions">
            <svg viewBox="0 0 32 32"><rect x="5" y="7" width="8" height="18" rx="1"/><rect x="19" y="11" width="8" height="14" rx="1"/></svg>
            <span>Compare <b id="cmpCount">0</b></span></button>
        </nav>
      </div>

      <button class="chip time-chip" id="timeChip" type="button" aria-controls="timePanel" aria-expanded="false" title="Change date and time (UTC)">
        <span id="clock" class="clock">00:00:00</span>
        <span id="dateStr" class="chip-sub">2026-12-14 UTC</span>
      </button>
    </div>

    <section class="time-panel" id="timePanel" hidden aria-label="Time controls">
      <label for="timeInput">Date and time (UTC)</label>
      <input type="datetime-local" id="timeInput" step="3600">
      <div class="row">
        <button type="button" class="ghost" data-step="-24">−1 day</button>
        <button type="button" class="ghost" data-step="-1">−1 h</button>
        <button type="button" class="ghost" id="playBtn" aria-pressed="false">Play ×20000</button>
        <button type="button" class="ghost" data-step="1">+1 h</button>
        <button type="button" class="ghost" data-step="24">+1 day</button>
      </div>
      <button type="button" class="link" id="nowBtn">Jump to now</button>
    </section>

    <!-- Mission setup: rover, route, timing -->
    <aside class="drawer left" id="setup" aria-label="Mission setup">
      <div class="drawer-head">
        <h2>Mission</h2>
        <button class="close" type="button" data-close="setup" aria-label="Close mission setup">×</button>
      </div>
      <form id="missionForm" class="form" novalidate>
        <fieldset>
          <legend><span class="step">1</span>Rover</legend>
          <label for="fRover">Rover</label>
          <select id="fRover"></select>
          <details id="roverDetails">
            <summary>Rover specifications</summary>
            <div class="spec-grid" id="specGrid"></div>
            <label for="fPanel">Solar panels</label>
            <select id="fPanel">
              <option value="vertical">Vertical, turning to face the Sun (best near the pole)</option>
              <option value="horizontal">Flat on top</option>
            </select>
            <label class="check"><input type="checkbox" id="fComms"> Needs Earth in view to drive</label>
            <p class="hint">Preset values are illustrative. Replace them with your rover's numbers.</p>
          </details>
        </fieldset>

        <fieldset>
          <legend><span class="step">2</span>Route</legend>
          <label for="fStart">Landing site</label>
          <select id="fStart"></select>
          <ol class="waypoints" id="wpList"></ol>
          <div class="row">
            <button class="ghost" type="button" id="drawBtn" aria-pressed="false">Draw on map</button>
            <button class="ghost" type="button" id="undoBtn">Undo</button>
            <button class="ghost" type="button" id="clearBtn">Clear</button>
          </div>
          <button class="ghost wide" type="button" id="planBtn">Find the sunniest route</button>
          <p class="hint" id="routeStats"></p>
        </fieldset>

        <fieldset>
          <legend><span class="step">3</span>When</legend>
          <label for="fDate">Landing date and time (UTC)</label>
          <input id="fDate" type="datetime-local" step="3600">
          <div class="two">
            <div><label for="fDays">Mission length (days)</label><input id="fDays" type="number" min="1" max="60" step="1"></div>
            <div><label for="fSlip">Landing date could slip by ± days</label><input id="fSlip" type="number" min="0" max="10" step="1"></div>
          </div>
          <label class="check"><input type="checkbox" id="fSurvive" checked> Rover must survive to the end of the mission, not just reach the destination</label>
          <label for="fRuns">Simulated runs</label>
          <select id="fRuns"><option value="25">25 (quick)</option><option value="50" selected>50</option><option value="100">100 (thorough)</option></select>
        </fieldset>
        <button class="cta wide" type="submit" id="simBtn">Simulate mission</button>
        <p class="hint" id="simStatus" aria-live="polite"></p>
      </form>
    </aside>

    <!-- Results -->
    <aside class="drawer right" id="report" aria-label="Mission forecast" hidden>
      <div class="drawer-head">
        <h2>Mission forecast</h2>
        <button class="close" type="button" data-close="report" aria-label="Close mission forecast">×</button>
      </div>
      <div id="reportBody"></div>
    </aside>

    <!-- Screen 4: stand on the Moon -->
    <section class="stand" id="stand" hidden aria-label="Stand on the Moon">
      <canvas id="pano" aria-label="360 degree sky from where the rover is. Drag to look around."></canvas>
      <div class="stand-top">
        <div>
          <h2>Stand on the Moon</h2>
          <p id="standSite" class="chip-sub"></p>
        </div>
        <div class="row">
          <button class="ghost" type="button" id="lookSun">Look at Sun</button>
          <button class="ghost" type="button" id="lookEarth">Look at Earth</button>
          <button class="close" type="button" data-close="stand" aria-label="Close sky view">×</button>
        </div>
      </div>
      <div class="stand-bottom">
        <div class="readout big" id="standReadout"></div>
        <div class="slider-row">
          <button class="round small" type="button" id="standPlay" aria-label="Play">▶</button>
          <input type="range" id="standSlider" min="0" max="336" value="0" aria-label="Mission hour">
          <span id="standTime" class="mono"></span>
        </div>
        <p class="hint" id="standNote"></p>
      </div>
    </section>

    <!-- Screen 5: compare -->
    <section class="compare" id="compare" hidden aria-label="Compare missions">
      <div class="drawer-head">
        <h2>Compare missions</h2>
        <button class="close" type="button" data-close="compare" aria-label="Close compare">×</button>
      </div>
      <div class="cmp-grid" id="cmpGrid"></div>
    </section>

    <div class="toast" id="toast" role="status" hidden></div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
