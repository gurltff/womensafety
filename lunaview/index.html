<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LunaView</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="description" content="Plan a lunar south-pole landing: sunlight for power, Earth in view for comms.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap">
</head>
<body>
  <main id="app">
    <canvas id="globe" aria-label="3D Moon. Drag to rotate, scroll to zoom, click a pin to pick a landing site."></canvas>
    <div id="labels" class="labels"></div>

    <header class="top">
      <button class="round" id="menuBtn" type="button" aria-label="Mission setup" aria-controls="setup" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>
        <input id="search" type="search" placeholder="Search a site or type coordinates (-89.4, -137)" autocomplete="off" aria-label="Search landing sites">
        <ul id="results" class="results" role="listbox" hidden></ul>
      </div>
      <button class="cta" id="runBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><circle cx="12" cy="12" r="4"/></svg>
        <span>Run mission</span>
      </button>
    </header>

    <div class="brand" aria-hidden="true">LUNAVIEW<span>CLPS mission browser</span></div>

    <div class="bottom">
      <button class="chip site-chip" id="siteChip" type="button" title="Open mission setup">
        <span class="chip-k">SITE</span>
        <span id="siteName">SHACKLETON RIM</span>
        <span class="chip-sub" id="siteCoords">89.68°S 166.00°W</span>
      </button>

      <div class="center-stack">
        <div class="readout" id="readout" aria-live="polite">
          <span class="sun-dot"></span><span id="roSun">Sun —</span>
          <span class="earth-dot"></span><span id="roEarth">Earth —</span>
        </div>
        <nav class="toolbar" aria-label="View controls">
          <button type="button" class="tool on" data-tool="pins" aria-pressed="true" title="Landing sites">
            <svg viewBox="0 0 32 32"><path d="M16 28s8-8.5 8-14a8 8 0 0 0-16 0c0 5.5 8 14 8 14Z"/><circle cx="16" cy="14" r="3"/></svg>
            <span>Sites</span></button>
          <button type="button" class="tool" data-tool="grid" aria-pressed="false" title="Latitude and longitude grid">
            <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/><ellipse cx="16" cy="16" rx="5" ry="11"/><path d="M5 16h22M7 10h18M7 22h18"/></svg>
            <span>Grid</span></button>
          <button type="button" class="tool on" data-tool="sun" aria-pressed="true" title="Real sunlight for the chosen time">
            <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="5"/><path d="M16 4v4M16 24v4M4 16h4M24 16h4M7.5 7.5l2.8 2.8M21.7 21.7l2.8 2.8M7.5 24.5l2.8-2.8M21.7 10.3l2.8-2.8"/></svg>
            <span>Sunlight</span></button>
          <button type="button" class="tool on" data-tool="pole" aria-pressed="true" title="South polar region outline">
            <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" stroke-dasharray="3 3"/><circle cx="16" cy="16" r="2.5"/></svg>
            <span>Pole</span></button>
          <button type="button" class="tool" data-tool="pole-view" title="Fly to the south pole">
            <svg viewBox="0 0 32 32"><path d="M6 24 16 8l10 16Z"/><path d="M11 17h10"/></svg>
            <span>Fly</span></button>
          <button type="button" class="tool" data-tool="stand" title="Stand on the Moon">
            <svg viewBox="0 0 32 32"><path d="M3 24c4-5 7-7 10-5s5-6 9-4 5 4 7 4"/><circle cx="22" cy="8" r="3"/><path d="M3 27h26"/></svg>
            <span>Stand</span></button>
          <button type="button" class="tool" data-tool="compare" title="Compare saved missions">
            <svg viewBox="0 0 32 32"><rect x="5" y="7" width="8" height="18" rx="1"/><rect x="19" y="11" width="8" height="14" rx="1"/></svg>
            <span>Compare <b id="cmpCount">0</b></span></button>
        </nav>
      </div>

      <button class="chip time-chip" id="timeChip" type="button" aria-controls="timePanel" aria-expanded="false" title="Change date and time (UTC)">
        <span id="clock" class="clock">00:00:00</span>
        <span id="dateStr" class="chip-sub">2026-11-14 UTC</span>
      </button>
    </div>

    <section class="time-panel" id="timePanel" hidden aria-label="Time controls">
      <label for="timeInput">Date and time (UTC)</label>
      <input type="datetime-local" id="timeInput" step="3600">
      <div class="row">
        <button type="button" class="ghost" data-step="-24">−1 day</button>
        <button type="button" class="ghost" data-step="-1">−1 h</button>
        <button type="button" class="ghost" id="playBtn" aria-pressed="false">Play ×20000</button>
        <button type="button" class="ghost" data-step="1">+1 h</button>
        <button type="button" class="ghost" data-step="24">+1 day</button>
      </div>
      <button type="button" class="link" id="nowBtn">Jump to now</button>
    </section>

    <!-- Screen 2: mission setup -->
    <aside class="drawer left" id="setup" aria-label="Mission setup" hidden>
      <div class="drawer-head">
        <h2>Mission setup</h2>
        <button class="close" type="button" data-close="setup" aria-label="Close mission setup">×</button>
      </div>
      <form id="setupForm" class="form" novalidate>
        <label for="fSite">Landing site</label>
        <select id="fSite"></select>
        <div class="two">
          <div><label for="fLat">Latitude</label><input id="fLat" type="number" step="0.01" min="-90" max="90" inputmode="decimal"></div>
          <div><label for="fLon">Longitude</label><input id="fLon" type="number" step="0.01" min="-180" max="360" inputmode="decimal"></div>
        </div>
        <label for="fDate">Landing date and time (UTC)</label>
        <input id="fDate" type="datetime-local" step="3600">
        <div class="two">
          <div><label for="fDays">Mission length (days)</label><input id="fDays" type="number" min="1" max="60" step="1"></div>
          <div><label for="fBatt">Battery (hours)</label><input id="fBatt" type="number" min="1" max="500" step="1"></div>
        </div>
        <p class="hint" id="horizonNote"></p>
        <button class="cta wide" type="submit">Run mission</button>
      </form>
    </aside>

    <!-- Screen 3: mission report -->
    <aside class="drawer right" id="report" aria-label="Mission report" hidden>
      <div class="drawer-head">
        <h2>Mission report</h2>
        <button class="close" type="button" data-close="report" aria-label="Close mission report">×</button>
      </div>
      <div id="reportBody"></div>
    </aside>

    <!-- Screen 4: stand on the Moon -->
    <section class="stand" id="stand" hidden aria-label="Stand on the Moon">
      <canvas id="pano" aria-label="360 degree sky from the landing site. Drag to look around."></canvas>
      <div class="stand-top">
        <div>
          <h2>Stand on the Moon</h2>
          <p id="standSite" class="chip-sub"></p>
        </div>
        <div class="row">
          <button class="ghost" type="button" id="lookSun">Look at Sun</button>
          <button class="ghost" type="button" id="lookEarth">Look at Earth</button>
          <button class="close" type="button" data-close="stand" aria-label="Close sky view">×</button>
        </div>
      </div>
      <div class="stand-bottom">
        <div class="readout big" id="standReadout"></div>
        <div class="slider-row">
          <button class="round small" type="button" id="standPlay" aria-label="Play">▶</button>
          <input type="range" id="standSlider" min="0" max="336" value="0" aria-label="Mission hour">
          <span id="standTime" class="mono"></span>
        </div>
        <p class="hint" id="standNote"></p>
      </div>
    </section>

    <!-- Screen 5: compare -->
    <section class="compare" id="compare" hidden aria-label="Compare missions">
      <div class="drawer-head">
        <h2>Compare missions</h2>
        <button class="close" type="button" data-close="compare" aria-label="Close compare">×</button>
      </div>
      <div class="cmp-grid" id="cmpGrid"></div>
    </section>

    <div class="toast" id="toast" role="status" hidden></div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
